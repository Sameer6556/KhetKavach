[project]
name = "khetkavach"
version = "1.0.0"
description = "KhetKavach: an agentic climate-risk shield for Indian farms, built on live open data and Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
